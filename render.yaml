services:
  - type: web
    name: bookmyservice-assessment
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-production.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --access-logfile - --error-logfile -
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bookmyservice-db
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: SECURE_SSL_REDIRECT
        value: "True"

databases:
  - name: bookmyservice-db
    databaseName: bookmyservice
    user: bookmyservice
    plan: free
    ipAllowList: []
